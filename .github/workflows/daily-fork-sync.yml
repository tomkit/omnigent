# Daily fork sync — keep this fork (tomkit/omnigent) rebased on upstream's
# (omnigent-ai/omnigent) LATEST STABLE RELEASE TAG (not the moving tip of
# upstream/main) WITHOUT losing the fork's custom commits, with Claude Code in
# the loop to resolve any rebase conflicts.
#
# This workflow does NOT deploy. Deploy is owned entirely by
# .github/workflows/fork-publish-server.yml, which on every push to `main`
# (and on workflow_dispatch) builds ghcr.io/tomkit/omnigent-server:sha-<sha>
# with build-arg OMNIGENT_EXTRAS=daytona and deploys deploy/fly/fly.tomkit.toml
# to the omnigent-tomkit Fly app. So any push to `main` here is automatically
# built + deployed there — this workflow only has to push (or open a PR).
#
# Remote naming INSIDE the runner (note: different from a local dev clone):
#   origin   = THIS fork (tomkit/omnigent)        <- we push here
#   upstream = omnigent-ai/omnigent (added below) <- we rebase onto its latest
#                                                    stable release tag
#
# Outcome policy (SAFE by default):
#   * No stable release published upstream   -> do nothing (short-circuits before
#                                               any rebase / Claude work).
#   * Latest release already in our history  -> do nothing (noop).
#   * Nothing new upstream (noop)            -> do nothing.
#   * Clean rebase (no conflicts)            -> force-push main. That push alone
#                                               triggers fork-publish-server.yml
#                                               to build + deploy.
#   * Claude had to resolve conflicts        -> push a fork-sync/<ts> branch and
#                                               open a PR for human review. main
#                                               is NOT pushed, so no deploy runs
#                                               until a human merges the PR (the
#                                               merge then triggers the publish
#                                               workflow). Override with
#                                               force_deploy (see below).
#
# Required secrets (repo Settings -> Secrets and variables -> Actions):
#   * FIREWORKS_API_KEY — the conflict-resolver step reads this to authenticate
#     the headless `claude` CLI against Fireworks' Anthropic-compatible endpoint
#     (it is passed as ANTHROPIC_AUTH_TOKEN). We resolve on Fireworks/GLM rather
#     than Anthropic because the Anthropic key is quota-capped; this is scoped to
#     the resolver only — the deployed managed/Daytona agents stay on Claude.
#     Deploy secrets like FLY_API_TOKEN live with fork-publish-server.yml, NOT here.
name: daily-fork-sync

on:
  schedule:
    # 20:00 UTC daily == 04:00 the next day in the user's local time (UTC+8),
    # a low-traffic hour. Adjust the cron if your quiet window moves.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: >-
          On a conflict-resolved run, push the resolved tree straight to `main`
          (which triggers build + deploy via fork-publish-server.yml) INSTEAD of
          opening a human-review PR. Leave false for the safe default (open a PR
          and let a human merge it). No effect on noop/clean runs.
        type: boolean
        default: false

# Never let two syncs race — a second run waits rather than rebasing/pushing
# on top of an in-flight one. We do NOT cancel-in-progress: a half-done rebase
# push should finish.
concurrency:
  group: daily-fork-sync
  cancel-in-progress: false

# Minimal permissions. We resolve conflicts with the headless `claude` CLI
# authenticated by a direct API key / OAuth token (NOT the Claude GitHub App),
# so OIDC is not used and `id-token: write` is deliberately NOT granted. (The
# `anthropics/claude-code-action` GitHub-App path WOULD need `id-token: write`;
# we avoid that path entirely — see the resolver step below.)
permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REMOTE: upstream
  UPSTREAM_URL: https://github.com/omnigent-ai/omnigent.git
  UPSTREAM_BRANCH: main
  FORK_BRANCH: main

jobs:
  sync:
    name: Rebase fork onto upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0
          # Keep the default GITHUB_TOKEN credentials so we can push back.
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ---- Stage the fork-rebase scripts OUTSIDE the working tree ----
      # SELF-REFERENCE FIX: the rebase below replays the fork's own commits onto
      # upstream and PAUSES at the first conflicting one. At that moment the
      # working tree reflects an EARLIER point in the fork's history — i.e. BEFORE
      # the commits that fixed these very scripts are replayed. If the later steps
      # ran `bash .github/scripts/<name>.sh` they would execute the STALE in-tree
      # copy from that mid-rebase snapshot, never the fixed main-HEAD version
      # (a chicken-and-egg: the fix can't take effect because the rebase fails
      # before replaying it). We copy the scripts from the freshly-checked-out
      # main HEAD to $RUNNER_TEMP (untouched by the rebase) and run those stable
      # copies in every step below. The scripts operate on the repo via the
      # current working directory (git commands against cwd) and never reference
      # each other by path, so running them from $RUNNER_TEMP is equivalent.
      - name: Stage fork-rebase scripts (immune to the rebase rewriting them)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/forkscripts"
          cp -p .github/scripts/resolve-release-tag.sh \
                .github/scripts/rebase-fork.sh \
                .github/scripts/resolve-rebase.sh \
                .github/scripts/check-no-orphans.sh \
                "${RUNNER_TEMP}/forkscripts/"
          chmod +x "${RUNNER_TEMP}/forkscripts/"*.sh
          ls -l "${RUNNER_TEMP}/forkscripts/"

      # Resolve upstream's latest STABLE release tag and fetch ONLY that tag.
      # If upstream has no published stable release, the script emits an empty
      # `tag` output and the rest of the job is skipped (a clean no-op) — we do
      # NOT fall back to rebasing onto main. This runs BEFORE the Claude CLI
      # install / any heavy work, so a no-release (and, via the rebase step's
      # ancestor check, a no-new-release) run exits fast and spends no Claude
      # API quota.
      - name: Add upstream remote and resolve latest stable release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add "${UPSTREAM_REMOTE}" "${UPSTREAM_URL}" 2>/dev/null \
            || git remote set-url "${UPSTREAM_REMOTE}" "${UPSTREAM_URL}"
          bash "${RUNNER_TEMP}/forkscripts/resolve-release-tag.sh"

      - name: Attempt rebase onto release tag
        id: rebase
        if: steps.release.outputs.tag != ''
        env:
          UPSTREAM_RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: bash "${RUNNER_TEMP}/forkscripts/rebase-fork.sh"

      # ---- Claude in the loop: only when the rebase paused on conflicts ----
      # IMPORTANT: the `anthropics/claude-code-action` REFUSES destructive git
      # ops (rebase / merge / rebase --continue / force-push) — the refusal is
      # baked into its system prompt and fires even with Bash allowed. So we do
      # NOT use that action. Instead we install the headless Claude Code CLI and
      # let our own script (resolve-rebase.sh) OWN the git rebase loop, calling
      # `claude -p` with file-editing tools ONLY (no Bash) to fix the conflicted
      # file contents. The shell runs every `git add` / `rebase --continue`.
      - name: Install Claude Code CLI
        if: steps.rebase.outputs.outcome == 'conflict'
        run: |
          # Pin the CLI for a reproducible daily production run; bump deliberately.
          npm install -g @anthropic-ai/claude-code@2.1.191
          claude --version

      - name: Resolve rebase conflicts (shell-driven loop, Claude edits files)
        if: steps.rebase.outputs.outcome == 'conflict'
        env:
          # Resolve conflicts on FIREWORKS (serving GLM), NOT Anthropic. The
          # headless `claude` CLI speaks the Anthropic Messages API and Fireworks
          # exposes an Anthropic-compatible endpoint at
          # ${ANTHROPIC_BASE_URL}/v1/messages, so we point Claude Code straight at
          # it — no translation proxy. We switched off Anthropic because its key
          # is quota-capped; Fireworks has more headroom. This is scoped to THIS
          # step only — the deployed managed/Daytona agents stay on Claude.
          #
          # Auth is the Fireworks key sent as a bearer token via
          # ANTHROPIC_AUTH_TOKEN (passed by env only, never logged). The model is
          # Fireworks' latest GLM ("glm-latest" -> glm-5p2, fully-qualified);
          # ANTHROPIC_SMALL_FAST_MODEL is pinned to the same id so the CLI's
          # background/"haiku" calls don't try to reach a non-existent model.
          ANTHROPIC_BASE_URL: https://api.fireworks.ai/inference
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.FIREWORKS_API_KEY }}
          ANTHROPIC_MODEL: accounts/fireworks/models/glm-5p2
          ANTHROPIC_SMALL_FAST_MODEL: accounts/fireworks/models/glm-5p2
          MAX_ITERS: "20"
        run: bash "${RUNNER_TEMP}/forkscripts/resolve-rebase.sh"

      - name: Verify rebase completed and landed on upstream
        if: steps.rebase.outputs.outcome == 'conflict'
        env:
          UPSTREAM_REF: refs/tags/${{ steps.release.outputs.tag }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [ -d "$(git rev-parse --git-path rebase-merge)" ] || \
             [ -d "$(git rev-parse --git-path rebase-apply)" ]; then
            echo "::error::Rebase is still in progress after resolution — conflicts were not fully resolved."
            git status
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean after rebase resolution."
            git status
            exit 1
          fi
          # Prove the rebase actually landed on upstream: upstream must be an
          # ancestor of HEAD AND HEAD must have moved from where we started. This
          # stops an aborted/empty resolution from masquerading as success.
          if ! git merge-base --is-ancestor "${UPSTREAM_REF}" HEAD; then
            echo "::error::HEAD is not a descendant of release ${RELEASE_TAG} — rebase did not land on the release tag."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" = "${{ steps.rebase.outputs.head_before }}" ]; then
            echo "::error::HEAD did not move during conflict resolution — suspect an aborted rebase."
            exit 1
          fi
          echo "Rebase completed, tree clean, HEAD descends from upstream."

      - name: Decide outcome
        id: decide
        if: steps.release.outputs.tag != ''
        run: |
          raw="${{ steps.rebase.outputs.outcome }}"
          case "$raw" in
            noop)     outcome=noop ;;
            clean)    outcome=clean ;;
            conflict) outcome=conflict-resolved ;;   # verify step proved it
            *)        echo "::error::Unexpected rebase outcome '$raw'"; exit 1 ;;
          esac
          echo "outcome=$outcome" >>"$GITHUB_OUTPUT"
          echo "Final sync outcome: $outcome"

      # ---- Orphan guard (fork-only defense-in-depth) ----
      # git's rename detection relocates our MODIFIED files when upstream renames
      # or deletes a directory, and surfaces normal content conflicts the resolver
      # handles. The one SILENT failure mode is a fork-ADDED file in a brand-new
      # subdirectory under a renamed-away/deleted tree: it replays with no
      # conflict, so neither resolve-rebase.sh (which only sees git-unmerged "U"
      # files) nor the verify step catches it, and it lands tracked under a path
      # that no longer exists upstream. This step fails the job BEFORE any push if
      # such an orphan exists. It runs on BOTH the clean and conflict-resolved
      # outcomes — critically the CLEAN path, which has no verify step and
      # force-pushes main (auto-deploying via fork-publish-server.yml). noop moves
      # nothing, so it is skipped.
      - name: Check for orphaned files under upstream-removed directories
        if: steps.decide.outputs.outcome == 'clean' || steps.decide.outputs.outcome == 'conflict-resolved'
        env:
          UPSTREAM_REF: refs/tags/${{ steps.release.outputs.tag }}
          HEAD_BEFORE: ${{ steps.rebase.outputs.head_before }}
        run: bash "${RUNNER_TEMP}/forkscripts/check-no-orphans.sh"

      # ---- Publish ----
      # We never deploy here. Pushing `main` is the deploy trigger: any push to
      # `main` is built + deployed by fork-publish-server.yml. So:
      #   * noop             -> push nothing.
      #   * clean            -> force-push main (this triggers build + deploy).
      #   * conflict-resolved-> open a review PR (no main push -> no deploy until
      #                         a human merges), UNLESS force_deploy is set, in
      #                         which case push the resolved tree straight to main
      #                         (triggering build + deploy) and skip the PR.
      - name: Publish result
        id: publish
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_deploy }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          outcome="${{ steps.decide.outputs.outcome }}"
          sha="$(git rev-parse HEAD)"

          if [ "$outcome" = "noop" ]; then
            echo "Already on latest upstream release ${RELEASE_TAG} — no push."
            echo "### Daily fork sync: up to date on release \`${RELEASE_TAG}\` :white_check_mark:" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$outcome" = "clean" ]; then
            echo "Clean rebase — force-pushing ${FORK_BRANCH} (this triggers build + deploy via fork-publish-server.yml)."
            git push --force-with-lease origin "HEAD:${FORK_BRANCH}"
            {
              echo "### Daily fork sync: clean rebase :white_check_mark:"
              echo "Pushed \`${FORK_BRANCH}\` at \`${sha}\`. Build + deploy run in fork-publish-server.yml."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # outcome == conflict-resolved
          if [ "${FORCE_DEPLOY}" = "true" ]; then
            # force_deploy: bypass the review PR and push the resolved tree
            # straight to main. fork-publish-server.yml then builds + deploys it.
            echo "force_deploy is set — pushing the conflict-resolved tree straight to ${FORK_BRANCH} (skips the review PR; triggers build + deploy)."
            git push --force-with-lease origin "HEAD:${FORK_BRANCH}"
            {
              echo "### Daily fork sync: conflicts resolved by Claude, force-deployed :warning:"
              echo "Pushed conflict-resolved tree \`${sha}\` straight to \`${FORK_BRANCH}\` (force_deploy). Build + deploy run in fork-publish-server.yml. No review PR was opened."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ts="$(date -u +%Y%m%d-%H%M%S)"
          branch="fork-sync/${ts}"
          echo "Conflicts were resolved by Claude — pushing ${branch} and opening a PR (no deploy until a human merges)."
          git push origin "HEAD:${branch}"

          # The review PR is REQUIRED. If it cannot be created we fail the job —
          # a conflict-resolved tree must never exist without a review gate (the
          # only way to deploy it is to merge this PR, which triggers the publish
          # workflow). The ONLY tolerated failure is "a PR already exists for this
          # branch" (e.g. a re-run): we detect that specifically and reuse the URL.
          body="Automated daily rebase of \`${FORK_BRANCH}\` onto upstream release \`${RELEASE_TAG}\`. Conflicts were resolved by Claude Code in CI. **Review the resolution before merging** — merging this PR pushes \`${FORK_BRANCH}\`, which triggers build + deploy via fork-publish-server.yml. (To bypass this gate, re-run the workflow with force_deploy=true.)"
          if pr_url="$(gh pr create \
                --base "${FORK_BRANCH}" \
                --head "${branch}" \
                --title "Daily fork sync (conflict-resolved) ${ts}" \
                --body "${body}" 2>err.txt)"; then
            echo "Opened review PR: ${pr_url}"
          else
            if grep -qiE 'already exists' err.txt; then
              pr_url="$(gh pr list --head "${branch}" --state open --json url --jq '.[0].url' 2>/dev/null || true)"
              if [ -z "${pr_url}" ]; then
                echo "::error::gh reported an existing PR for ${branch} but none could be found."
                cat err.txt; exit 1
              fi
              echo "Reusing existing review PR: ${pr_url}"
            else
              echo "::error::gh pr create failed — refusing to leave a conflict-resolved tree without a review PR."
              cat err.txt; exit 1
            fi
          fi

          {
            echo "### Daily fork sync: conflicts resolved by Claude :warning:"
            echo "Review PR for branch \`${branch}\`: ${pr_url}"
            echo "No deploy runs until this PR is merged (the merge pushes \`${FORK_BRANCH}\` and triggers fork-publish-server.yml)."
          } >>"$GITHUB_STEP_SUMMARY"
